name: PWA browser validation
on:
  push:
    branches: [codex/pwa-qa]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify offline mode, application scope and ranking snapshot
        run: |
          npm --prefix "$RUNNER_TEMP/pwa-qa" install --no-fund --no-audit --ignore-scripts puppeteer-core@24.31.0
          export PWA_CHROME="$(command -v google-chrome)"
          node checks/pwa-smoke.js
