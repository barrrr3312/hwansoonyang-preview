function rebCalc(){let prev=20,carry=[0,0,0,0],sumLv=0;return levels.map((l,i)=>{let total=prev+3*(l-1),a=alloc[i],s=mode===0?[a[0],a[1],a[2],total-a[0]-a[1]-a[2]]:[a[0],total-a[0]-a[1]-a[2],a[2],a[1]],real=s.map((v,j)=>v+carry[j]);sumLv+=l;let k=Math.trunc(total/12+20*(i+1)/4+(sumLv-85*(i+1))/4),den=real.reduce((a,b)=>a+b,0),raw=real.map(v=>Math.trunc((v/den*k+.5)*100)/100),ap=raw.map(Math.trunc);carry=raw.map((v,j)=>v-ap[j]);prev=ap.reduce((a,b)=>a+b,0)+10*(i+1);return {s,k,prev,ap,total}})}async function copyRebirth(){try{await navigator.clipboard.writeText(rebCalc().map((r,i)=>`${i+1}환: ${r.prev}`).join("\n"));toast("복사 완료")}catch{toast("복사 권한을 확인하세요")}} function rebirth(){let r=rebCalc()[stage];app.innerHTML=`<h1>환포 계산기</h1><section><div class="roles">${btn('순캐','mode=0;rebirth()',mode===0)}${btn('완캐','mode=1;rebirth()',mode===1)}</div><div class="roles">${levels.map((l,i)=>btn(`${i+1}환`,`stage=${i};rebirth()`,stage===i)).join('')}</div></section><section><label>환생 레벨<input type="number" min="1" value="${levels[stage]}" onchange="levels[stage]=Number(this.value);rebirth()"></label>${['체',mode===0?'완':'순','건'].map((n,i)=>`<label>${n}<input type="number" min="0" value="${alloc[stage][i]}" onchange="alloc[stage][${i}]=Number(this.value);rebirth()"></label>`).join('')}<div class="turn"><small>자동 배분 · ${mode===0?'순':'완'}</small><div class="big">${r.s[mode===0?3:1]}</div></div><div class="bar">${r.s.map((v,i)=>`<span style="width:${Math.max(0,v)/Math.max(1,r.total)*100}%;background:${colors[i]}"></span>`).join('')}</div><div class="stats">${r.s.map((v,i)=>`<div style="color:${colors[i]}">${['체','완','건','순'][i]}<br>${v}</div>`).join('')}</div>${btn('초기값 복원','levels=[140,140,140,140,140];alloc=defaults.map(a=>a.slice());rebirth()')}</section><section><small>${stage+1}환 결과 / 기준 최대 ${[66,98,130,161,192][stage]}</small><div class="big">${r.prev} 환포</div>${r.s.some(v=>v<0)?'<p>스탯 배분을 확인하세요.</p>':''}<div class="stats">${r.ap.map((v,i)=>`<div>${['체','완','건','순'][i]}<br>${v}< function setRaidRole(j){role=j;raidPage();save("role",j)} let wake;async function toggleLive(){live=!live;if(live){if(!role)role=1;try{wake=await navigator.wakeLock.request('screen')}catch{}}else{try{await wake?.release()}catch{}}raidPage();document.body.classList.toggle('live',live)}function raidPage(){let p=raid.find(r=>r[0]===floor),i=raid.indexOf(p),e=p[1],col=e==='지'?colors[0]:colors[1];app.innerHTML=`<div class="line"><h1>라돈타 공략</h1>${btn(live?'실전 종료':'실전 모드','toggleLive()',live)}</div>${live?'':`<section><details><summary>권장 파티 및 준비물 · 3순 2완</summary><p>순캐: 찍순 평균 450 이상 추천, 방탑 권장, 지/수 딜펫 각각 1마리</p><p>말린청어알, 각성제, 수호부적, 지/수우대, 오로라, 무지개. 속성목걸이 강력 추천.</p><p>완캐: 지/수 속성템, 지/수 탱펫 각각 1마리</p></details></section>`}<div class="sticky"><div class="roles">${roles.map((r,j)=>live&&j===0?'':btn(r,`setRaidRole(${j})`,role===j)).join('')}</div>${live?`<select onchange="floor=Number(this.value);raidPage()">${raid.map(r=>`<option value="${r[0]}" ${floor===r[0]?'selected':''}>${r[0]}층 · ${r[1]}속성</option>`).join('')}</select>`:`<div class="floors" style="margin-top:8px">${raid.map(r=>btn(`${r[0]}층<br><small style="color:${r[1]==='지'?colors[0]:colors[1]}">${r[1]}속성</small>`,`floor=${r[0]};raidPage()`,floor===r[0])).join('')}</div>`}</div><section><div class="line"><h2>${floor}층 · ${roles[role]}</h2><strong style="color:${col}">${e}속성</strong></div>${[1,2,3].filter(j=>!role||role===j).map(j=>{let steps=j===1?[e+'우대']:p[j],rep=j===1?'은혜':`${j-1}완 탱펫에 수호`,renew=j===1?e+'우대':j===2?'은혜':'1순 기력회복 (아부의 물)';return `<h3>${j}순</h3>${steps.map((s,k)=>`<div class="turn"><small>${k+1}턴</small><strong>${esc(s)}</strong></div>`).join('')}<div class="turn"><small>${steps.length+1}턴 이후</small><strong>${rep}</strong></div><div class="turn" style="border:1px solid #EDCB90"><small>우대 잔여 1턴</small><strong style="color:#EDCB90">${renew}</strong></div>`}).join('')}${!role||role>=4?`<h3>${role?roles[role]:'1완 · 2완'}</h3><p>${e}속성 탱펫 운용</p><strong>${p[4]?`1${p[4]>1?'~'+p[4]:''}턴 가드${floor>=100?' 권장':''}`:'별도 가드 지시 없음'}</strong>`:''}</section><section><h2 style="color:#F87171">딜 순서</h2>${p[5].split('>').map((s,j)=>`<div class="turn"><strong style="color:${j===0?'#F87171':'inherit'}">${j+1}. ${esc(s)}</strong></div>`).join('')}</section><div class="grid">${i?btn('← '+raid[i-1][0]+'층',`floor=${raid[i-1][0]};raidPage();scrollTo(0,0)`):'<span></span>'}${i<raid.length-1?btn(raid[i+1][0]+'층 →',`floor=${raid[i+1][0]};raidPage();scrollTo(0,0)`,true):''}</div>`}
let editing=-1;function admin(){app.innerHTML=`<h1>관리자 · 로컬 테스트</h1><section><small>인증 및 서버 연동 전입니다. 이 브라우저에만 저장됩니다. 공개 서버에 관리자 기능을 그대로 배포하지 마세요.</small></section><section><h2>공략 작성</h2><label>카테고리<select id="ac">${['레이드','라돈타','아이템','퀘스트','기타 TIP'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>제목<input id="at"></label><label>본문<textarea id="ab" rows="6"></textarea></label><div class="grid">${btn('임시저장','postSave(false)')}${btn('공개 등록','postSave(true)',true)}</div>${posts.map((p,i)=>`<div class="line"><span>${esc(p.title)} · ${p.pub?'공개':'임시'}</span>${btn('수정',`postEdit(${i})`)}${btn('삭제',`postDelete(${i})`)}</div>`).join('')}</section><section><h2>라돈타 데이터 관리</h2><select id="af" onchange="adminRaid()">${raid.map(r=>`<option>${r[0]}</option>`).join('')}</select><div id="ar"></div></section>`;adminRaid()}function postSave(pub){let p={cat:$('ac').value,title:$('at').value.trim(),body:$('ab').value,pub};if(!p.title||pub&&!p.body.trim())return toast('제목과 본문을 확인하세요');if(editing<0)posts.unshift(p);else posts[editing]=p;editing=-1;save('posts',posts);admin();toast('로컬 저장 완료')}function postEdit(i){editing=i;let p=posts[i];$('ac').value=p.cat;$('at').value=p.title;$('ab').value=p.body}function postDelete(i){if(confirm('삭제할까요?')){posts.splice(i,1);save('posts',posts);editing=-1;admin()}}function adminRaid(){let p=raid.find(r=>r[0]===Number($('af').value));$('ar').innerHTML=`<label>속성<select id="ae"><option ${p[1]==='지'?'selected':''}>지</option><option ${p[1]==='수'?'selected':''}>수</option></select></label><label>2순 초반 행동 (한 줄 한 턴)<textarea id="aa">${esc(p[2].join('\n'))}</textarea></label><label>3순 초반 행동<textarea id="ab3">${esc(p[3].join('\n'))}</textarea></label><label>가드 턴 수<input id="ag" type="number" min="0" max="3" value="${p[4]}"></label><label>딜 순서 ( &gt; 구분)<textarea id="ad">${esc(p[5])}</textarea></label>${btn('층별 공략 저장','raidSave()',true)}`}function raidSave(){let p=raid.find(r=>r[0]===Number($('af').value));p[1]=$('ae').value;p[2]=$('aa').value.sp
